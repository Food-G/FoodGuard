name: CI

on:
  push:
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # 테스트는 합성 데이터만 사용하고 DB 에 접속하지 않음. .env가 없어도 config.py 기본값으로 동작.
      - run: python -m pytest tests

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # gradlew가 git에 실행 권한 없이(100644) 올라가 있어 chmod 필요.
      - run: chmod +x gradlew
      # 통합 테스트는 메모리 H2 만 쓴다 (application-test.properties). H2 가 아니면 연결 전에 거부한다 (IntegrationTest.H2Only).
      - run: ./gradlew build --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # @mui/system@^9 가 @mui/x-data-grid@7 의 peer 범위(^5||^6||^7)와 충돌해 plain `npm ci`는 ERESOLVE로 실패함.
      - run: npm ci --legacy-peer-deps
      - run: npm run build   # tsc 타입 검사 + vite 빌드

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -m unittest fgcli.test_planner -v   # 발주 참모 산식·판단 (네트워크 없음)
      - run: python -m unittest fgagent.test_runtime -v   # 에이전트 공통 런타임 (네트워크·Claude 없음)
      - run: python -m unittest fgagent.test_waste_guard -v   # 폐기 위험 후보 산출 (네트워크·Claude 없음)
      - run: python -m unittest fgagent.test_donation_matcher -v   # 기부 매칭 안전 규칙 (네트워크·Claude 없음)
      - run: python -m unittest fgagent.test_hq_review -v   # 발주 이상점수·폴링 (네트워크·Claude 없음)
      - run: python -m unittest fgagent.test_auditor -v   # 데이터 품질 점검 (네트워크·Claude 없음)
      - run: python -m unittest fgagent.test_inbound -v   # 입고 지연 규칙 (네트워크·Claude 없음)
      - run: python -m unittest fgagent.test_copilot -v   # Copilot 권한 가드레일·주간 브리핑 (네트워크·Claude 없음)

  # 배포 이미지가 빌드되는지 확인 (실행은 하지 않음)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t foodguard-backend backend
      - run: docker build -t foodguard-ai ai-service
      - run: docker build -t foodguard-frontend frontend
