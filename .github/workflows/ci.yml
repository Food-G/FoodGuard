name: CI

on:
  push:
  pull_request:
    branches: [dev, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      # contextLoads 테스트는 공용 TiDB 에 접속하므로 DB 가 필요 없는 단위 테스트만 돌린다.
      # 테스트용 H2 프로필이 생기면 ./gradlew build 로 바꾼다.
      - run: ./gradlew assemble test --tests 'com.foodguard.util.*' --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc 타입 검사 + vite 빌드

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      # DB 연결은 지연 생성이라 .env 없이도 import 가 된다.
      - run: python -c "import main"
      - run: python -m unittest discover -s tests -t .   # 정확도 지표 (DB 없음)

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest fgcli.test_planner -v   # 발주 참모 산식·판단 (네트워크 없음)
      - run: python -m unittest fgagent.test_runtime -v   # 에이전트 공통 런타임 (네트워크·Claude 없음)
