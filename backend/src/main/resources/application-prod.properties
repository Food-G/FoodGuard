# 운영 프로필: SPRING_PROFILES_ACTIVE=prod. 값은 서버의 backend/.env 또는 환경변수로 준다

# 스키마를 자동으로 바꾸지 않는다. validate 는 공유 DB 의 STORE·USER 대문자 테이블을 못 찾아 기동에 실패한다
# (Spring 네이밍이 소문자로 바꾸고 Hibernate 가 대소문자를 구분해 찾음). 테이블 이름을 소문자로 바꾸면 validate 로 올릴 수 있다
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 값이 없으면 기동 실패 (개발 기본값으로 운영되지 않게)
ai.service.key=${AI_INTERNAL_KEY}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.ws.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGINS}
