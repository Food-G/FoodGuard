spring.application.name=foodguard

# 비밀값은 환경변수로만 받는다 (backend/.env 또는 IntelliJ Run Configuration). 키 목록: .env.example
# 실행 위치가 backend/ 든 레포 루트든 .env 를 찾도록 두 경로를 본다
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# TiDB Cloud 가 유휴 연결을 먼저 끊기 때문에, 풀이 그보다 먼저 연결을 교체·점검하게 한다
# (기본 maxLifetime 30분이면 끊긴 연결을 재사용하다 30초 타임아웃 후 500)
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=60000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# SQL 로그·JWT 만료 등 실행 환경별 값은 application-local / application-prod 에 둔다
# 로컬 실행: --spring.profiles.active=local

# Server
server.port=8080

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
