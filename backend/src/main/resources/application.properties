spring.application.name=foodguard

# 비밀값은 backend/.env(커밋 금지)에서 읽는다. 형식은 backend/.env.example 참고
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/foodguard?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=47YVZmrMBdLbupr.root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Server
server.port=8080

# AI Service
ai.service.url=http://localhost:8000
