# 통합 테스트 전용 (DEV_ROADMAP Q-1). 메모리 DB 만 쓴다 — 공용 TiDB 에 create-drop 이 닿으면 테이블이 전부 지워진다.
# H2 가 아니면 IntegrationTest.H2Only 가 연결 전에 시작을 거부한다.
spring.datasource.url=jdbc:h2:mem:fg;MODE=MySQL;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-secret-not-used-anywhere-else-0123456789
ai.service.url=http://localhost:0
ai.service.token=
agent.service.url=http://localhost:0
