      <line x1="1270" y1="398" x2="1276" y2="550"/><line x1="1320" y1="398" x2="1320" y2="550"/>
      <line x1="1370" y1="398" x2="1364" y2="550"/><line x1="1415" y1="398" x2="1404" y2="550"/>
