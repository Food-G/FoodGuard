<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDEFD9"/>
      <stop offset=".55" stop-color="#C4E3C2"/>
      <stop offset="1" stop-color="#A9D3AE"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".12" r=".55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#F4FBF1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F4FBF1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D3A878"/>
      <stop offset=".25" stop-color="#C08E5C"/>
      <stop offset="1" stop-color="#8E623D"/>
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A56B"/>
      <stop offset="1" stop-color="#A9733F"/>
    </linearGradient>
    <radialGradient id="tomato" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#FF7A5C"/>
      <stop offset=".6" stop-color="#E8402A"/>
      <stop offset="1" stop-color="#B92A1B"/>
    </radialGradient>
    <radialGradient id="lemon" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFF3A0"/>
      <stop offset="1" stop-color="#F2C531"/>
    </radialGradient>
    <radialGradient id="cabbage" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#C8E89A"/>
      <stop offset="1" stop-color="#6FAE4A"/>
    </radialGradient>
    <radialGradient id="onion" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#F6D3A0"/>
      <stop offset="1" stop-color="#C98B4A"/>
    </radialGradient>
    <radialGradient id="eggplant" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#B07CC6"/>
      <stop offset="1" stop-color="#5E2F78"/>
    </radialGradient>
    <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blurMid" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="basketClip"><path d="M1140 398 H1500 L1472 548 H1168 Z"/></clipPath>
