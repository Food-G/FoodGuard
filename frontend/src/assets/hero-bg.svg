    <path d="M1540 548 C1530 510 1560 485 1580 480 C1600 485 1625 510 1615 548 C1605 565 1550 565 1540 548 Z" fill="url(#onion)"/>
    <path d="M1580 480 C1578 468 1582 460 1588 455" stroke="#B9824A" stroke-width="3" fill="none" stroke-linecap="round"/>
